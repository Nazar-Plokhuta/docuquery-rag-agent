# ============================================================
# DocuQuery RAG Agent — Docker Compose (local development)
# ============================================================
# Usage (from the repository root):
#   docker compose --env-file .env -f docker/docker-compose.yml up --build
#
# `--env-file` is required: Compose resolves `${VAR}` interpolation from a `.env`
# next to the compose file (docker/), not from the shared one at the repo root.
#
# All relative paths below resolve against this file's directory (docker/).
# The repository-level `data/` directory is bind-mounted so that ChromaDB vectors
# and SQLite telemetry persist across container restarts without a named volume.
# ============================================================

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: docuquery-api
    image: docuquery-rag-agent:dev
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8000}:8000"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma_db
      # File-backed SQLite keeps local development free of a database server.
      # Production points DATABASE_URL at PostgreSQL (postgresql+asyncpg://...).
      DATABASE_URL: sqlite+aiosqlite:////app/data/telemetry.db

    volumes:
      # Persistent data: ChromaDB index and SQLite telemetry survive restarts.
      - ../data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Uvicorn reload flag is only meaningful during local dev; set via env override
    # rather than hard-coding into the Dockerfile CMD so the production image
    # remains unchanged.
    command: >
      uvicorn src.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level ${LOG_LEVEL:-info}
