# ============================================================
# DocuQuery RAG Agent — Docker Compose
# ============================================================
# Usage (from the repository root):
#   docker compose -f docker/docker-compose.yml --env-file .env up --build
#
# Optional standalone ChromaDB server (otherwise Chroma runs in-process and
# persists to the bind-mounted data/ directory):
#   CHROMA_HOST=chroma            # in .env
#   docker compose -f docker/docker-compose.yml --env-file .env --profile chroma up --build
#
# The Studio UI is then served at http://localhost:3000 and proxies /api/v1/*
# to the `api` service over the internal network.
#
# `--env-file` is required: Compose resolves `${VAR}` interpolation from a `.env`
# next to the compose file (docker/), not from the shared one at the repo root.
#
# All relative paths below resolve against this file's directory (docker/).
#
# DATABASE_URL is assembled here from the POSTGRES_* variables and deliberately
# ignores the DATABASE_URL in `.env`, which targets localhost for `uv run`
# development and would be unreachable from inside the container network.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: docuquery-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docuquery}

    ports:
      # Host port is configurable so a locally installed PostgreSQL does not clash.
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      # `$$` defers expansion to the container shell, where the POSTGRES_* vars exist.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  chroma:
    # Opt-in via `--profile chroma`; pair with CHROMA_HOST=chroma in .env.
    profiles: ["chroma"]
    # Keep the server on the same major line as the chromadb client in uv.lock.
    image: chromadb/chroma:${CHROMA_IMAGE_TAG:-1.5.9}
    container_name: docuquery-chroma
    restart: unless-stopped

    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data

    volumes:
      - chroma_data:/data

    healthcheck:
      # The image ships neither curl nor wget; a bare TCP connect is enough to
      # confirm the listener is up.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: docuquery-api
    image: docuquery-rag-agent:dev
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
        # Ignored when the `chroma` profile is not active.
        required: false

    ports:
      - "${APP_PORT:-8000}:8000"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Comma-separated origins allowed cross-origin access; empty disables CORS.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # Provider keys are optional: LiteLLM routes by model identifier, so only the
      # key for the provider actually configured in *_MODEL needs a value.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LITELLM_DROP_PARAMS: ${LITELLM_DROP_PARAMS:-true}
      # Local mode persists under the bind mount; remote mode (CHROMA_HOST set)
      # talks to the `chroma` service and ignores the directory.
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma_db
      CHROMA_HOST: ${CHROMA_HOST:-}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-docuquery}

    volumes:
      # Uploaded/sample documents and, in local mode, the ChromaDB index.
      - ../data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Migrations run on every start (idempotent) so the schema is current before
    # the first request; `exec` hands PID 1 to Uvicorn for clean signal handling.
    # Settings expects an uppercase LOG_LEVEL while the Uvicorn CLI accepts only
    # lowercase, so the value is lowercased here rather than changing either contract.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head
        && exec uvicorn src.main:app --host 0.0.0.0 --port 8000
        --log-level "$$(printf '%s' "$${LOG_LEVEL:-info}" | tr '[:upper:]' '[:lower:]')"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Next.js bakes rewrite destinations in at build time; the runtime
        # variable below documents the value but cannot change it.
        API_INTERNAL_URL: http://api:8000
    container_name: docuquery-web
    image: docuquery-web:dev
    restart: unless-stopped

    depends_on:
      api:
        condition: service_started

    ports:
      - "${WEB_PORT:-3000}:3000"

    environment:
      API_INTERNAL_URL: http://api:8000

    healthcheck:
      # Probes through the Next.js rewrite, so a pass proves web -> api routing
      # and not merely that the Node process is listening. 127.0.0.1 rather than
      # localhost: Alpine resolves localhost to ::1, where Next is not bound.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/v1/health/",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pg_data:
  chroma_data:
