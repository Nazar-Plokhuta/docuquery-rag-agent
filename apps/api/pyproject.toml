[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling cannot auto-detect the package because the source root is `src/`
# and the project name uses hyphens.  Explicit declaration resolves the wheel
# file-selection heuristic failure.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "docuquery-rag-agent"
version = "1.2.0"
description = "Enterprise-grade Retrieval-Augmented Generation microservice with document ingestion, vector search, and grounded LLM responses."
# No `readme` field: the monorepo README lives at the repository root, outside
# this package's build root, and hatchling aborts on a missing readme file.
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "chromadb>=0.5.0",
    "litellm>=1.40.0",
    "tiktoken>=0.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Not a production driver: SQLAlchemy uses it for the hermetic in-memory
    # SQLite databases that keep the test suite offline.
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

# PEP 735 group rather than an extra: `uv sync` installs the `dev` group by
# default and `--no-dev` excludes it, so production images never ship test tooling.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    # Allow assert statements in tests / internal guards
    "B011",
]

# FastAPI's `Depends()`, `Security()`, and `Query()` are intentionally used as
# default argument values — this is the canonical FastAPI DI pattern.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
    "fastapi.Header",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
# The local `alembic/` migrations directory would otherwise make Ruff classify
# the third-party Alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Paths resolve against this file's directory (the rootdir), so `src` stays
# importable when pytest is launched from the repository root as well.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
